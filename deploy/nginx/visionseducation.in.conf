server {
    listen 80;
    server_name visionseducation.in www.visionseducation.in;

    client_max_body_size 25M;

    # --- Security headers (OWASP ZAP remediation, 2026-10-18 report) ---
    # Do not advertise the nginx version.
    server_tokens off;
    # NOTE: HSTS (Strict-Transport-Security) is intentionally NOT here — it must
    # only be sent over HTTPS. See the commented 443 reference block at the
    # bottom of this file; certbot manages the real 443 block on the server.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP matches exactly what the built SPA loads: same-origin assets/API,
    # Google Fonts (CSS + font files) and inline style attributes used by React
    # components. script-src 'self' blocks injected/inline scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Django static files (admin, DRF, Swagger) - populated by collectstatic
    location /static/ {
        alias /srv/visions/backend/django-backend/staticfiles/;
        expires 7d;
    }

    # Uploaded student photos and other media (persistent, owned by deploy)
    location /media/ {
        alias /srv/visions/backend/django-backend/media/;
    }

    # Django REST API -> Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Django admin (used for super-admin account management)
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Never cache the SPA entry point so deploys take effect immediately.
    # (`expires` is used instead of add_header Cache-Control so the security
    # headers above are still inherited into this location.)
    location = /index.html {
        root /srv/visions/frontend/visions-platform/dist/public;
        expires -1;
    }

    # Vite emits content-hashed assets; safe to cache for a year.
    location /assets/ {
        root /srv/visions/frontend/visions-platform/dist/public;
        expires 1y;
    }

    # React SPA (built to dist/public per frontend/visions-platform/vite.config.ts)
    location / {
        root /srv/visions/frontend/visions-platform/dist/public;
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# HTTPS reference block (NOT active — certbot manages the real 443 server
# block on the server). After running certbot, merge the security headers and
# the HSTS line below into the generated `listen 443 ssl` block so the ZAP
# findings are fixed for HTTPS traffic as well:
